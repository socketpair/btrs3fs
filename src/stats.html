<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>btrs3fs statistics</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --accent: #2f6fde; --accent2: #12a37c; --warn: #d9822b; --bad: #d64545; --bar: #c9d8f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e4e7ee; --muted: #8f97a8; --line: #2b313c;
      --accent: #6b9cff; --accent2: #3ccf9f; --warn: #f0a050; --bad: #ff6b6b; --bar: #2e4370;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline;
           padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); }
  #status { margin-left: auto; font-size: 13px; }
  #status::before { content: "●"; margin-right: 6px; }
  #status.live { color: var(--accent2); }
  #status.down { color: var(--bad); }
  main { padding: 16px 20px 32px; max-width: 1400px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 22px 0 10px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .wide { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 24px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .card .detail { color: var(--muted); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .meter { height: 6px; border-radius: 3px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--accent); width: 0; }
  .chart svg { width: 100%; height: 90px; display: block; margin-top: 6px; }
  .chart polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .chart .area { fill: var(--accent); opacity: .12; stroke: none; }
  .chart .axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .hist td.bar { width: 55%; }
  .hist .b { height: 12px; background: var(--bar); border-radius: 2px; }
  .bad { color: var(--bad); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>btrs3fs</h1>
  <span class="sub" id="title">connecting…</span>
  <span id="status">—</span>
</header>
<main>
  <div class="grid" id="cards"></div>

  <h2>Last 5 minutes</h2>
  <div class="grid wide">
    <div class="card chart" id="ch-up"></div>
    <div class="card chart" id="ch-rd"></div>
    <div class="card chart" id="ch-par"></div>
    <div class="card chart" id="ch-dirty"></div>
  </div>

  <h2>Distributions since start</h2>
  <div class="grid wide">
    <div class="card"><div class="label">Upload size (PUT/PATCH body)</div><table class="hist" id="h-size"></table></div>
    <div class="card"><div class="label">Upload time</div><table class="hist" id="h-uplat"></table></div>
    <div class="card"><div class="label">Zones uploaded per FLUSH</div><table class="hist" id="h-zones"></table></div>
    <div class="card"><div class="label">GET time</div><table class="hist" id="h-getlat"></table></div>
  </div>

  <h2>Details</h2>
  <div class="grid wide">
    <div class="card"><div class="label">Uploads to S3</div><table id="t-up"></table></div>
    <div class="card"><div class="label">Reads</div><table id="t-rd"></table></div>
    <div class="card"><div class="label">Kernel requests</div><table id="t-req"></table></div>
  </div>
  <p class="hint">Counters are totals since the device server started; “/s” columns are the last second.
     Raw data: <a href="stats.json">stats.json</a>.</p>
</main>
<script>
"use strict";
const HISTORY = 300;
const series = { up: [], rd: [], par: [], dirty: [] };
let prev = null, prevTime = 0;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function bytes(n) {
  const u = ["B", "KiB", "MiB", "GiB", "TiB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n.toFixed(0) : n.toFixed(n < 10 ? 2 : 1)) + " " + u[i];
}
const rate = n => bytes(n) + "/s";
const num = n => n.toLocaleString("en-US", { maximumFractionDigits: n < 10 ? 1 : 0 });
const sizeLabel = b => b >= 1048576 ? (b / 1048576) + "M" : (b / 1024) + "K";
function duration(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? d + "d " : "") + (d || h ? h + "h " : "") + m + "m " + (s % 60) + "s";
}

function card(label, value, detail, meter) {
  return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div>` +
    (detail ? `<div class="detail">${detail}</div>` : "") +
    (meter !== undefined ? `<div class="meter"><div style="width:${Math.min(100, meter).toFixed(1)}%"></div></div>` : "") +
    `</div>`;
}

/* Bucket i holds values in (bounds[i-1], bounds[i]]; the last one is open-ended. */
function histRows(h, label) {
  const total = h.counts.reduce((a, b) => a + b, 0);
  if (!total) return `<tr><td>no data yet</td></tr>`;
  const max = Math.max(...h.counts);
  return h.counts.map((c, i) => {
    if (!c) return "";
    const lo = i ? h.bounds[i - 1] : null, hi = h.bounds[i];
    const name = label(lo, hi);
    return `<tr><td>${name}</td><td class="bar"><div class="b" style="width:${(c / max * 100).toFixed(1)}%"></div></td>` +
      `<td>${num(c)}</td><td>${(c / total * 100).toFixed(1)}%</td></tr>`;
  }).join("");
}
const leLabel = fmt => (lo, hi) => hi === undefined ? "&gt; " + fmt(lo) : "≤ " + fmt(hi);
function rangeLabel(lo, hi) {
  if (hi === undefined) return "&gt; " + lo;
  const from = lo === null ? 0 : lo + 1;
  return from === hi ? String(hi) : from + "–" + hi;
}
function quantile(h, q) {
  const total = h.counts.reduce((a, b) => a + b, 0);
  if (!total) return "–";
  let seen = 0;
  for (let i = 0; i < h.counts.length; i++) {
    seen += h.counts[i];
    if (seen >= Math.ceil(q * total)) return i < h.bounds.length ? "≤ " + h.bounds[i] + " ms" : "&gt; " + h.bounds[h.bounds.length - 1] + " ms";
  }
  return "–";
}

function chart(id, title, data, fmt) {
  const max = Math.max(1e-9, ...data);
  const n = data.length;
  const pts = data.map((v, i) => `${(HISTORY - n + i) / (HISTORY - 1) * 100},${(1 - v / max) * 100}`).join(" ");
  const first = n ? (HISTORY - n) / (HISTORY - 1) * 100 : 0;
  const area = n ? `${first},100 ${pts} 100,100` : "";
  const cur = n ? data[n - 1] : 0;
  $(id).innerHTML = `<div class="label">${title}</div><div class="value">${fmt(cur)}</div>` +
    `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polygon class="area" points="${area}"/><polyline points="${pts}"/></svg>` +
    `<div class="axis"><span>−5 min</span><span>peak ${fmt(Math.max(0, ...data))}</span><span>now</span></div>`;
}

function push(name, v) {
  const s = series[name];
  s.push(v);
  if (s.length > HISTORY) s.shift();
}

function table(id, head, rows) {
  $(id).innerHTML = `<tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>` +
    rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("");
}

function render(s, p, dt) {
  // Rates over the last interval; zero on the first sample or after a restart.
  const fresh = !p || s.uptime_secs < p.uptime_secs || dt <= 0;
  const d = k => fresh ? 0 : Math.max(0, s[k] - p[k]) / dt;
  const dsum = k => fresh ? 0 : Math.max(0, s[k].sum - p[k].sum) / dt;
  const uploads = s.uploads_put + s.uploads_patch;

  $("title").innerHTML = `${esc(s.disk)} on ${esc(s.device)} · up ${duration(s.uptime_secs)}`;
  document.title = `btrs3fs ${s.device}`;

  const upRate = dsum("upload_size"), rdRate = d("read_from_s3");
  const upPerSec = fresh ? 0 : Math.max(0, uploads - p.uploads_put - p.uploads_patch) / dt;
  const errRate = d("upload_errors") + d("req_errors");
  $("cards").innerHTML =
    card("Upload to S3", rate(upRate), `${num(upPerSec)} uploads/s · total ${bytes(s.upload_size.sum)}`) +
    card("Read from S3", rate(rdRate), `${num(d("gets"))} GET/s · total ${bytes(s.read_from_s3)}`) +
    card("RAM buffers", bytes(s.dirty_bytes), `${s.dirty_zones} zones · limit ${bytes(s.dirty_limit)}`,
         s.dirty_bytes / s.dirty_limit * 100) +
    card("Uploads in parallel", `${s.uploads_in_flight}`, `max ${s.uploads_in_flight_max} · kernel requests ${s.requests_in_flight} (max ${s.requests_in_flight_max})`) +
    card("Zones", `${s.zones.open} open`, `${s.zones.closed} closed · ${s.zones.full} full · ${s.zones.empty} empty`) +
    card("Problems", `<span class="${s.upload_errors + s.req_errors ? "bad" : ""}">${num(s.upload_errors + s.req_errors)}</span>`,
         `failed uploads ${num(s.upload_errors)} · I/O errors ${num(s.req_errors)} · S3 retries ${num(s.retries)}` +
         (errRate ? ` · <span class="bad">${num(errRate)}/s</span>` : ""));

  push("up", upRate); push("rd", rdRate); push("par", s.uploads_in_flight); push("dirty", s.dirty_bytes);
  chart("ch-up", "Upload to S3", series.up, rate);
  chart("ch-rd", "Read from S3", series.rd, rate);
  chart("ch-par", "Uploads in flight", series.par, v => num(v));
  chart("ch-dirty", "RAM buffers", series.dirty, bytes);

  $("h-size").innerHTML = histRows(s.upload_size, leLabel(sizeLabel)) +
    `<tr><td colspan="4">average ${uploads ? bytes(s.upload_size.sum / uploads) : "–"}</td></tr>`;
  $("h-uplat").innerHTML = histRows(s.upload_latency_ms, leLabel(v => v + " ms")) +
    `<tr><td colspan="4">p50 ${quantile(s.upload_latency_ms, .5)} · p90 ${quantile(s.upload_latency_ms, .9)} · p99 ${quantile(s.upload_latency_ms, .99)}</td></tr>`;
  $("h-zones").innerHTML = histRows(s.zones_per_flush, rangeLabel);
  $("h-getlat").innerHTML = histRows(s.get_latency_ms, leLabel(v => v + " ms")) +
    `<tr><td colspan="4">p50 ${quantile(s.get_latency_ms, .5)} · p90 ${quantile(s.get_latency_ms, .9)} · p99 ${quantile(s.get_latency_ms, .99)}</td></tr>`;

  table("t-up", ["", "total", "/s"], [
    ["PUT (first write to a zone)", num(s.uploads_put), num(d("uploads_put"))],
    ["PATCH (append)", num(s.uploads_patch), num(d("uploads_patch"))],
    ["reason: FLUSH", num(s.uploads_flush), num(d("uploads_flush"))],
    ["reason: FUA", num(s.uploads_fua), num(d("uploads_fua"))],
    ["reason: buffer limit", num(s.uploads_background), num(d("uploads_background"))],
    ["reason: explicit", num(s.uploads_explicit), num(d("uploads_explicit"))],
    ["reason: zone FINISH", num(s.uploads_finish), num(d("uploads_finish"))],
    ["S3 retries", num(s.retries), num(d("retries"))],
    ["failed uploads", num(s.upload_errors), num(d("upload_errors"))],
  ]);
  table("t-rd", ["", "total", "/s"], [
    ["from S3", bytes(s.read_from_s3), rate(rdRate)],
    ["GET requests", num(s.gets), num(d("gets"))],
    ["from RAM buffers", bytes(s.read_from_ram), rate(d("read_from_ram"))],
    ["zeros (past write pointer)", bytes(s.read_zeros), rate(d("read_zeros"))],
  ]);
  table("t-req", ["", "count", "/s", "bytes"], [
    ["READ", num(s.req_read), num(d("req_read")), bytes(s.req_read_bytes)],
    ["WRITE (metadata, superblock)", num(s.req_write), num(d("req_write")), bytes(s.req_write_bytes)],
    ["ZONE_APPEND (data)", num(s.req_append), num(d("req_append")), bytes(s.req_append_bytes)],
    ["FLUSH", num(s.req_flush), num(d("req_flush")), ""],
    ["FUA writes", num(s.req_fua), num(d("req_fua")), ""],
    ["zone reset", num(s.req_zone_reset), num(d("req_zone_reset")), ""],
    ["other zone ops", num(s.req_zone_mgmt), num(d("req_zone_mgmt")), ""],
    ["zone reports", num(s.req_report), num(d("req_report")), ""],
    ["errors", num(s.req_errors), num(d("req_errors")), ""],
  ]);
}

async function tick() {
  try {
    const r = await fetch("stats.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const s = await r.json();
    const now = performance.now();
    render(s, prev, (now - prevTime) / 1000);
    prev = s; prevTime = now;
    $("status").className = "live";
    $("status").textContent = "live, every 1 s";
  } catch (e) {
    $("status").className = "down";
    $("status").textContent = "no connection to the device server";
  }
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
